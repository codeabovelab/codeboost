name: Agent isolation
# Runs on every pull request and on pushes to the same branches as CI, so `real-docker` can be a required check.
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  real-docker:
    runs-on: ubuntu-latest
    # Covers the 10 min image build, 2 min teardown and the per-test Docker budgets.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # The Vitest projects finish ordinary tests first, then run the Docker-backed files one at a time.
      - run: npm test
