name: Agent isolation
# Runs on every pull request and on pushes to the same branches as CI, so `real-docker` can be a required check.
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  real-docker:
    runs-on: ubuntu-latest
    # Covers the typecheck, the ordinary Vitest project, the 10 min image build and ordinary run times of the
    # Docker-backed files. It does not cover every test and hook at its own Vitest limit: the five afterAll hooks that
    # call the shared sweep allow 46 min between them (#189), which only a stalled daemon reaches.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # The Vitest projects finish ordinary tests first, then run the Docker-backed files one at a time.
      - run: npm test
