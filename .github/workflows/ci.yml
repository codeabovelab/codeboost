name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The longest recent run took 20 min, about half of this limit. A hung browser suite would otherwise hold the
    # runner for GitHub's default of 360 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # The Docker-backed files run one at a time in the Agent isolation workflow; running them here would put them in
      # parallel against the same image tag and daemon. Exclude exactly the dockerTests list in vitest.config.ts;
      # test/vitest-config.test.ts fails if the two differ.
      - run: npm test -- --exclude test/agent-container.test.ts --exclude test/agent-gate.test.ts --exclude test/agent-network.test.ts --exclude test/agent-planning.test.ts --exclude test/agent-question.test.ts --exclude test/agent-supervisor.test.ts --exclude test/runner-workspace.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
